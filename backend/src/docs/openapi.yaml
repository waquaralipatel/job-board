openapi: 3.0.3

info:
  title: Globalco Job Board API
  version: 1.0.0
  description: REST API for the Globalco Job Board application.

servers:
  - url: http://localhost:5000/api

tags:
  - name: Companies
  - name: Jobs

paths:
  /companies:
    get:
      tags:
        - Companies
      summary: Get all companies
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: search
          schema:
            type: string
      responses:
        "200":
          description: Companies fetched successfully

    post:
      tags:
        - Companies
      summary: Create a company
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCompany"
      responses:
        "201":
          description: Company created successfully

  /companies/{id}:
    get:
      tags:
        - Companies
      summary: Get company by ID
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Company fetched successfully

    put:
      tags:
        - Companies
      summary: Update company
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCompany"
      responses:
        "200":
          description: Company updated successfully

    delete:
      tags:
        - Companies
      summary: Delete company
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Company deleted successfully

  /jobs:
    get:
      tags:
        - Jobs
      summary: Get all jobs
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: location
          schema:
            type: string
        - in: query
          name: employmentType
          schema:
            type: string
            enum:
              - FULL_TIME
              - PART_TIME
              - CONTRACT
              - INTERNSHIP
              - FREELANCE
      responses:
        "200":
          description: Jobs fetched successfully

    post:
      tags:
        - Jobs
      summary: Create a job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJob"
      responses:
        "201":
          description: Job created successfully

  /jobs/{id}:
    get:
      tags:
        - Jobs
      summary: Get job by ID
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Job fetched successfully

    put:
      tags:
        - Jobs
      summary: Update job
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateJob"
      responses:
        "200":
          description: Job updated successfully

    delete:
      tags:
        - Jobs
      summary: Delete job
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Job deleted successfully

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string

  schemas:
    CreateCompany:
      type: object
      required:
        - name
        - location
      properties:
        name:
          type: string
        logo:
          type: string
        website:
          type: string
        location:
          type: string

    UpdateCompany:
      type: object
      properties:
        name:
          type: string
        logo:
          type: string
        website:
          type: string
        location:
          type: string

    CreateJob:
      type: object
      required:
        - title
        - description
        - location
        - employmentType
        - experience
        - category
        - companyId
      properties:
        title:
          type: string
        description:
          type: string
        salary:
          type: string
        location:
          type: string
        employmentType:
          type: string
          enum:
            - FULL_TIME
            - PART_TIME
            - CONTRACT
            - INTERNSHIP
            - FREELANCE
        experience:
          type: string
        category:
          type: string
        companyId:
          type: string

    UpdateJob:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        salary:
          type: string
        location:
          type: string
        employmentType:
          type: string
          enum:
            - FULL_TIME
            - PART_TIME
            - CONTRACT
            - INTERNSHIP
            - FREELANCE
        experience:
          type: string
        category:
          type: string
        companyId:
          type: string